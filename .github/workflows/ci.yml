name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    name: Validate Environment & Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Go & Git Environment
        run: |
          go version
          git --version
      - name: Verify Dependencies
        run: |
          go mod verify
          go mod download

  lint:
    name: Format, Linters & Static Analysis
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Code Formatting
        run: test -z "$(gofmt -l .)"
      - name: Static Analysis (go vet)
        run: go vet ./...
      - name: Check Installer Syntax
        run: sh -n install.sh
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

  test:
    name: Test Suite (${{ matrix.os }})
    needs: deps
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Codecov authenticates the upload via OIDC, so no CODECOV_TOKEN secret is needed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Git Version Check
        run: git --version
      - name: Run Tests (Linux with Race & Coverage)
        if: runner.os == 'Linux'
        run: |
          go test -v -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out
      - name: Run Tests (macOS)
        if: runner.os == 'macOS'
        run: go test -v ./...
      - name: Upload Coverage Report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-coverage-report
          path: coverage.out
          retention-days: 14
      - name: Upload Coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          use_oidc: true
          fail_ci_if_error: false # a Codecov outage should not block merges

  build:
    name: Build Production Artifacts
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Snapshot Packages with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Verify Debian Package
        run: |
          dpkg-deb --info dist/gitquest_linux_amd64.deb
          apt-get --simulate install ./dist/gitquest_linux_amd64.deb
          dpkg-deb --extract dist/gitquest_linux_amd64.deb "$RUNNER_TEMP/gitquest-deb"
          "$RUNNER_TEMP/gitquest-deb/usr/bin/gitquest" --version
      - name: Smoke Test Built Binary
        run: |
          ./dist/gitquest_linux_amd64_v1/gitquest --version
          ./dist/gitquest_linux_amd64_v1/gitquest --help
      - name: Upload Snapshot Binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-binaries
          path: dist/
          retention-days: 7
