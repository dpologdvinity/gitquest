version: "2"

run:
  timeout: 5m

linters:
  default: standard
  exclusions:
    presets:
      - common-false-positives
    rules:
      - path: "_test\\.go$"
        linters:
          - errcheck
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.Closer.Close
        - os.Remove
        - os.RemoveAll
